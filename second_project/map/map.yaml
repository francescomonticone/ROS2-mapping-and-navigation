# Map metadata for Nav2 map_server
# Generated from SLAM Toolbox in Task 1

image: map.png           # Map image file (PNG format)
mode: trinary            # Occupancy mode: trinary (occupied/free/unknown)
resolution: 0.05          # Meters per pixel (5 cm)
origin: [-6.84, -10.5, 0.0]   # Real-world pose of bottom-left pixel [x, y, yaw]
negate: 0                # Do not invert colors
occupied_thresh: 0.65    # Pixels > 65% intensity are considered occupied
free_thresh: 0.25        # Pixels < 25% intensity are considered free